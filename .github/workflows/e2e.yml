name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le déploiement Convex de test (laudable-viper-831) est PARTAGÉ entre toutes les
# PR (pas éphémère). On SÉRIALISE les runs e2e : un seul à la fois pousse son
# code puis teste. Sans ça, une 2e PR qui démarre écraserait le Convex déployé
# par la 1re pendant que celle-ci teste encore (course → faux rouges).
# cancel-in-progress: false = on ne tue pas le run en cours, le suivant attend.
concurrency:
  group: e2e-convex-test
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pousse schéma + fonctions Convex de LA BRANCHE sur le déploiement de TEST
      # AVANT le build Next et Playwright → chaque PR teste SON propre code, plus
      # un Convex périmé (fin des déploiements manuels). La deploy key détermine
      # la cible : CONVEX_TEST_DEPLOY_KEY est scopée sur le MÊME déploiement de
      # test (laudable-viper-831) que l'URL CONVEX_TEST_URL interrogée ensuite —
      # surtout PAS la prod. Placé tôt (avant browsers/build) pour échouer vite
      # si la clé manque ou si le code Convex ne compile pas.
      - name: Deploy Convex (test)
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_URL }}

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_URL }}
          # Remédiation sécurité — gate des mutations de seed/cleanup e2e +
          # mot de passe du user e2e. Doit être identique à la variable
          # E2E_SECRET du deployment Convex de test (cf README §Auth).
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
