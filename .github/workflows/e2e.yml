name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PLUS de groupe `concurrency`. Il sérialisait les runs parce que le déploiement
# Convex de test était PARTAGÉ entre toutes les PR (une 2e PR écrasait le Convex
# de la 1re pendant qu'elle testait). Chaque run a désormais SON backend local,
# en SQLite, jeté à la fin : deux PR peuvent tester en parallèle sans se voir.

jobs:
  # ⚠️ NE PAS RENOMMER cette clé, et ne PAS lui ajouter de `name:`. Le ruleset de
  # `main` exige le check `test` — c'est la clé du job qui le nomme, pas le `name:`
  # du workflow (renommé « E2E Tests » → « Tests » sans rien casser, précisément
  # pour cette raison). Un job rebaptisé = un check requis qui n'arrive jamais =
  # toutes les PR bloquées en attente d'un contrôle qui n'existe plus.
  #
  # C'est aussi pourquoi les tests unitaires sont une ÉTAPE ici et non un job
  # séparé : un second job ne serait pas dans les checks requis, donc ne
  # bloquerait rien. Et le rendre bloquant via `needs:` serait pire — un job
  # requis « skipped » est traité comme satisfait par GitHub, donc un unitaire
  # rouge laisserait passer le merge.
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # AVANT tout le reste, parce que ça coûte une seconde et que ça garde une
      # route publique de rendre des écrans sans identifiant. Un contrôle qui
      # dépend de la mémoire de quelqu'un n'est pas un contrôle.
      - name: Aucun harnais d'aperçu sans authentification
        run: ./scripts/verif-harnais.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # AVANT le backend Convex, le navigateur Playwright et le build Next : deux
      # secondes ici évitent de dérouler ~10 minutes de pipeline pour un défaut
      # que l'unitaire nomme tout de suite. Le même raisonnement que le contrôle
      # de harnais ci-dessus, appliqué à la logique métier.
      #
      # Ces 1690 tests sont les garde-fous du produit : parité du moteur de paie
      # lib↔convex, uniq vs count sur les compteurs de personnes, devise sans
      # défaut, allowlist des champs exposés aux créatrices, fuseau des dates
      # rendues côté serveur. Jusqu'ici ils ne tournaient qu'en local et ne
      # bloquaient aucune PR — un garde-fou qui ne s'exécute pas au moment du
      # merge est décoratif.
      #
      # Le runner est en UTC : c'est la MÊME horloge que le runtime Convex, donc
      # les specs de fuseau y sont vraiment mises à l'épreuve (sur un poste réglé
      # à Paris, certaines passeraient au vert avec le bug).
      - name: Tests unitaires (vitest)
        run: pnpm test:unit

      # Garde i18n — bloque (a) toute chaîne française réintroduite dans un
      # fichier DÉJÀ extrait, (b) toute divergence de clés entre messages/fr.json
      # et messages/en.json. La baseline (scripts/i18n-baseline.json) liste ce
      # qui reste à extraire et ne peut que rétrécir : une entrée devenue propre
      # fait aussi échouer le job, pour forcer le nettoyage de la liste.
      - name: Garde i18n (chaînes en dur + parité des catalogues)
        run: pnpm check:i18n

      # Le tag du backend est lu DANS le script (source unique). Un tag bumpé
      # là-bas sans toucher ce workflow provoque au pire un cache miss — donc un
      # téléchargement de 57 Mo, jamais une exécution sur la mauvaise version.
      - name: Résoudre le tag du backend Convex
        id: backend
        run: |
          tag=$(grep -oE 'precompiled-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]+' \
            scripts/convex-local.sh | head -1)
          [ -n "$tag" ] || { echo "Tag du backend introuvable dans scripts/convex-local.sh"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Backend Convex épinglé : $tag"

      - name: Cache du binaire backend Convex
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex/binaries/${{ steps.backend.outputs.tag }}
          key: convex-backend-${{ runner.os }}-${{ steps.backend.outputs.tag }}

      # Démarre le backend en tâche de fond, attend `/version`, pousse schéma +
      # fonctions de LA BRANCHE, puis pose les variables d'auth et le secret e2e.
      # Le script échoue vite (set -e) si l'une de ces étapes ne passe pas.
      #
      # AUCUN secret GitHub n'est nécessaire : le secret d'instance, la clé admin,
      # les clés JWT et E2E_SECRET sont générés PAR RUN. Il n'y a donc plus rien à
      # reposer quand le repo change de remote, et rien à faire fuiter.
      - name: Démarrer le backend Convex local
        run: ./scripts/convex-local.sh start

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210

      - name: Run Playwright tests
        run: |
          eval "$(./scripts/convex-local.sh env)"
          pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Les logs du backend disent ce que le rapport Playwright ne dit pas : la
      # ConvexError exacte levée côté serveur, et l'ordre des requêtes.
      - name: Upload logs du backend Convex
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: convex-backend-log
          path: .convex-local/backend.log
          retention-days: 7

      - name: Arrêter le backend Convex local
        if: always()
        run: ./scripts/convex-local.sh stop
