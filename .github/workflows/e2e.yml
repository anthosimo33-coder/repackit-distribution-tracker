name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_URL }}

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.CONVEX_TEST_URL }}
          # Remédiation sécurité — gate des mutations de seed/cleanup e2e +
          # mot de passe du user e2e. Doit être identique à la variable
          # E2E_SECRET du deployment Convex de test (cf README §Auth).
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
